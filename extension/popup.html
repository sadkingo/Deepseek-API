<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>DeepSeek Register</title>
  <style>
    body { font: 13px system-ui, sans-serif; width: 360px; margin: 0; padding: 12px; color: #222; background: #fff; }
    h1 { font-size: 15px; margin: 0 0 8px; }
    label { display: block; margin: 6px 0 2px; color: #555; }
    input[type=text] { width: 100%; box-sizing: border-box; padding: 5px 6px; border: 1px solid #bbb; border-radius: 4px; }
    .row { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
    button { padding: 6px 10px; border: 1px solid #888; border-radius: 4px; background: #f4f4f4; cursor: pointer; }
    button.primary { background: #1f6feb; color: #fff; border-color: #1f6feb; }
    button:disabled { opacity: .5; cursor: default; }
    .status { margin-top: 10px; padding: 8px; border-radius: 4px; background: #f6f8fa; }
    .ok { color: #1a7f37; } .bad { color: #b42318; } .warn { color: #9a6700; }
    pre { margin: 8px 0 0; max-height: 180px; overflow: auto; font-size: 11px; background: #fafafa; border: 1px solid #eee; padding: 6px; white-space: pre-wrap; }
    a { color: #1f6feb; cursor: pointer; }
    .hint { color: #666; font-size: 12px; margin-top: 4px; }
  </style>
</head>
<body>
  <h1>DeepSeek Register</h1>

  <label for="server">Deepseek-API server</label>
  <input type="text" id="server" placeholder="http://127.0.0.1:8010">
  <label for="token">Register token (only if REGISTER_TOKEN is set on the server)</label>
  <input type="text" id="token" placeholder="">
  <div class="row">
    <input type="checkbox" id="incognito">
    <label for="incognito" style="margin:0">Use an incognito window (default: normal window, DeepSeek site data cleared first)</label>
  </div>
  <div class="row">
    <input type="checkbox" id="trusted">
    <label for="trusted" style="margin:0">Trusted input (real key/mouse events via DevTools)</label>
  </div>
  <div class="row">
    <button id="save">Save</button>
    <button id="register" class="primary">Register now</button>
    <button id="poll">Check for jobs</button>
  </div>

  <div class="status">
    <div id="server-line">Server: …</div>
    <div id="incognito-line">Incognito: …</div>
    <div id="creds-line"></div>
    <div id="job-line"></div>
    <pre id="log"></pre>
  </div>
  <div class="hint">Trigger from the terminal with <code>bin/register</code> or <code>POST /register</code>.</div>

  <script src="popup.js"></script>
</body>
</html>
